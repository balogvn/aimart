# pre-commit: fast local checks before a commit exists. CI runs the authoritative versions of the
# same checks (`make lint`, `make type`, gitleaks, actionlint, zizmor), so skipping a hook only
# moves the failure to the PR.
#
#   uv run --frozen pre-commit install          # once per clone
#   uv run --frozen pre-commit run --all-files  # everything, now
#
# Revisions are commit SHAs (`# frozen:` is the tag they were taken from), like the workflow
# actions, because a hook runs arbitrary code on the developer's machine. ruff's rev matches the
# ruff locked in uv.lock so the hook and `make lint` cannot disagree. Dependabot (pre-commit
# ecosystem) proposes updates.
minimum_pre_commit_version: "4.0.0"

# Binary fixtures and the lockfile are data: never "fix" their whitespace.
exclude: ^(uv\.lock|tests/fixtures/.*)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # frozen: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy runs from the project venv, not an isolated hook env: --strict needs the real
  # dependencies (pydantic plugin, x402, mcp) to type-check anything meaningful.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (src/)
        entry: uv run --frozen mypy src
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
